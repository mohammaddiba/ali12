<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            
        }
        body
        {
            height: 100vh;
            margin: 0;
        }
        #main{

            width: 33.33%;
            min-width: 300px;
            border-style: solid;
            border-color: brown;
            box-shadow: 0 4px 12px rgba(0,0,0,1);

            display: flex;
            flex-direction: row;
            background: linear-gradient(to right,brown,yellow);
        }
        img
        {
            width: 100px;
            height: 100px;
        }
        #info
        {
            direction: rtl;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #desc
        {
            flex: 1;
        }
        #btn
        {
            direction: rtl;
        }
        button
        {
            background-color: brown;
            font-size: 1.5rem;
            border-radius: 10%;
            border: solid;
            width: 100px;
        }
        @media screen and (max-width:600px) {
            #main{
                flex-direction: column;
            }
            #btn,#img{
                display: flex;
               justify-content: center   ;
            }
            
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="img">
            <img src="../../image/img1.jpg" alt="تصویر محصول">
        </div>
        <div id="info">
            <div id="p"><span>نام محصول : </span><span>خودکار</span></div>
            <div id="desc"><span>شرح محصول : </span><span>این محصول کاملا وارداتی بوده و نمونه داخلی ندارد</span></div>
            <div id="btn"><button>خرید</button></div>
        </div>
    </div>
</body>
</html>
