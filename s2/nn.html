<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html
        {
            background-color: red;
            height:100%;
        }
        body
        {
        
            background-color: yellow;
            background-image: url(a1.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
           
            margin: 0;
            
        }
     img
     {
       height: 400px;
       width: 400px;
        border-radius: 50%;
     }
     #dd     {
        border: dashed 2px yellow;
        width: 400px;
        height: 400px;
        background-image: linear-gradient(to right,red,green);
        resize: both;
        box-shadow: 1px 1px 17px 17px rgba(0, 0, 0, 0.436);
        overflow: auto;
        
     }
     #d1
     {
        width: 100px;
        height: 100px;
        background-color: blue;
        position: fixed;
        right: 0;
        bottom: 0;
     }
     #h1
     {
        font-size: 2em;
     }
     #h2
     {
        font-size: calc(2rem - 5px);
     }
    </style>
</head>
<body>
    <div id="a1">
        <h1 id="h1">
            This is a test
        </h1>
    </div>
    
    <div id="a2">
        <h1 id="h2">
            This is a test
        </h1>
    </div>
<!-- <img src="../../image/img1.jpg" alt=""> -->
<div id="dd">
    <div id="d1">

    </div>
</div>
</body>
</html>
