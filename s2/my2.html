<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">

<style>

dialog{
  opacity:0;
  transform: scale(.9);
  transition:3s;
}

dialog.show{
  opacity:1;
  transform: scale(1);
}

dialog::backdrop{
  background:rgba(0,0,0,0);
  transition:3s;
}

dialog.show::backdrop{
  background:rgba(0,0,0,.5);
}

</style>
</head>

<body>
  <details>
    <summary>نمایش توضیحات</summary>
  
    <div>
      این متن زمانی دیده می‌شود که کاربر روی عنوان کلیک کند.
    </div>
    <p>دانلود:</p>
    <progress value="60" max="100"></progress>
    
    <p>شارژ باتری:</p>
    <meter min="0" max="100" value="75"></meter>
    
  
  </details>
  <p>برای کپی کردن <kbd>Ctrl</kbd> + <kbd>C</kbd> را بزنید.</p>
  <p>اگر دستور را اجرا کنید این پیام نمایش داده می‌شود:</p>

  <samp>
  File uploaded successfully
  </samp>
  
<button onclick="openModal()">باز کردن</button>

<dialog id="myDialog">
  <p>این یک مودال است</p>
  <button onclick="closeModal()">بستن</button>
</dialog>

<script>

const dialog = document.getElementById("myDialog")

function openModal(){
  dialog.showModal()
  setTimeout(()=>{
    dialog.classList.add("show")
  },10)
}

function closeModal(){
  dialog.classList.remove("show")

  setTimeout(()=>{
    dialog.close()
  },300)
}

</script>

</body>
</html>
